services:
  postgres:
    image: postgres:16
    container_name: food-randomizer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: food_user
      POSTGRES_PASSWORD: food_pass
      POSTGRES_DB: food_randomizer
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
