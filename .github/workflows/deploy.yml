name: Deploy API (Oracle)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to randomizer-api-01
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (attempt 1)
        id: deploy_first
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.OCI_API_HOST }}
          username: ${{ secrets.OCI_API_USER }}
          key: ${{ secrets.OCI_API_SSH_KEY }}
          port: ${{ secrets.OCI_API_SSH_PORT || '22' }}
          timeout: 120s
          script_stop: true
          command_timeout: 120m
          debug: true
          script: |
            set -euo pipefail

            cd ~/Food-Randomizer

            # Force server repo to remote main and avoid local merge conflicts.
            git fetch "https://x-access-token:${{ secrets.DEPLOY_REPO_TOKEN }}@github.com/BadKirill/Food-Randomizer.git" main
            git checkout main
            git reset --hard FETCH_HEAD

            # Materialize production env from GitHub secret so deploy is deterministic.
            cat > apps/api/.env.prod <<'EOF'
            ${{ secrets.API_ENV_PROD }}
            EOF

            chmod 600 apps/api/.env.prod

            bash scripts/deploy-api.sh

      - name: Deploy over SSH (attempt 2 retry on handshake/network failure)
        if: ${{ steps.deploy_first.outcome == 'failure' }}
        id: deploy_retry
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_API_HOST }}
          username: ${{ secrets.OCI_API_USER }}
          key: ${{ secrets.OCI_API_SSH_KEY }}
          port: ${{ secrets.OCI_API_SSH_PORT || '22' }}
          timeout: 120s
          script_stop: true
          command_timeout: 120m
          debug: true
          script: |
            set -euo pipefail

            cd ~/Food-Randomizer

            # Force server repo to remote main and avoid local merge conflicts.
            git fetch "https://x-access-token:${{ secrets.DEPLOY_REPO_TOKEN }}@github.com/BadKirill/Food-Randomizer.git" main
            git checkout main
            git reset --hard FETCH_HEAD

            # Materialize production env from GitHub secret so deploy is deterministic.
            cat > apps/api/.env.prod <<'EOF'
            ${{ secrets.API_ENV_PROD }}
            EOF

            chmod 600 apps/api/.env.prod

            bash scripts/deploy-api.sh
