name: Deploy API (Oracle)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to randomizer-api-01
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.OCI_API_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.OCI_API_SSH_PORT || '22' }}" "${{ secrets.OCI_API_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over native SSH with retries
        shell: bash
        timeout-minutes: 120
        env:
          OCI_API_HOST: ${{ secrets.OCI_API_HOST }}
          OCI_API_USER: ${{ secrets.OCI_API_USER }}
          OCI_API_SSH_PORT: ${{ secrets.OCI_API_SSH_PORT || '22' }}
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          API_ENV_PROD: ${{ secrets.API_ENV_PROD }}
        run: |
          set -euo pipefail
          API_ENV_PROD_B64="$(printf '%s' "$API_ENV_PROD" | base64 | tr -d '\n')"
          ESCAPED_DEPLOY_TOKEN="${DEPLOY_REPO_TOKEN//\'/\'\\\'\'}"
          REMOTE_SCRIPT=$'set -euo pipefail\ncd ~/Food-Randomizer\ngit fetch "https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/BadKirill/Food-Randomizer.git" main\ngit checkout main\ngit reset --hard FETCH_HEAD\necho "$API_ENV_PROD_B64" | base64 -d > apps/api/.env.prod\nchmod 600 apps/api/.env.prod\nbash scripts/deploy-api.sh'

          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3"
            if ssh \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=8 \
              -o StrictHostKeyChecking=yes \
              -p "$OCI_API_SSH_PORT" \
              "$OCI_API_USER@$OCI_API_HOST" \
              "DEPLOY_REPO_TOKEN='$ESCAPED_DEPLOY_TOKEN' API_ENV_PROD_B64='$API_ENV_PROD_B64' bash -lc $(printf '%q' "$REMOTE_SCRIPT")"
            then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Deploy attempt $attempt failed, retrying in 20s..."
              sleep 20
            fi
          done

          echo "Deploy failed after 3 attempts."
          exit 1
