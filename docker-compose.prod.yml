services:
  api:
    image: ${API_IMAGE:-ghcr.io/badkirill/food-randomizer-api:latest}
    env_file:
      - apps/api/.env.prod
    command: sh -c "npm run prisma:migrate:deploy && node dist/apps/api/src/main.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
